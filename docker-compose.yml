services:
  postgres:
    image: postgres:16-alpine
    container_name: gifts-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Bound to loopback only: this box is a dev machine, not a server.
    ports:
      - "127.0.0.1:5433:5432"
    # A named volume, not a bind mount: Documents/ is Google Drive synced and its
    # reparse points break anything that reads the data directory.
    volumes:
      - gifts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  gifts-pgdata:
